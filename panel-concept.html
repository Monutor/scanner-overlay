<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel Concept — Scanner Overlay</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;background:#1a1a2e;color:#eee;display:flex;min-height:100vh;align-items:center;justify-content:center}
  .phone{width:380px;height:750px;background:#0f0f1a;border-radius:40px;border:3px solid #333;position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
  .screen{position:relative;width:100%;height:100%;overflow:hidden}
  .notch{position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:30px;background:#0f0f1a;border-radius:0 0 18px 18px;z-index:10}
  .mock-app{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#555}
  .mock-app svg{width:60px;height:60px;opacity:.3}

  .panel{position:absolute;top:100px;right:-280px;width:280px;height:500px;background:rgba(30,30,60,.95);backdrop-filter:blur(20px);border-radius:20px 0 0 20px;border:1px solid rgba(255,255,255,.08);border-right:none;transition:right .35s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px;z-index:5}
  .panel.open{right:0}
  .panel.edge-left{right:auto;left:-280px;border-radius:0 20px 20px 0;border-right:1px solid rgba(255,255,255,.08);border-left:none}
  .panel.edge-left.open{left:0}

  .tab{position:absolute;top:50%;right:0;transform:translateY(-50%);width:32px;height:80px;background:rgba(30,30,60,.95);backdrop-filter:blur(20px);border-radius:10px 0 0 10px;border:1px solid rgba(255,255,255,.08);border-right:none;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:6;transition:right .35s cubic-bezier(.22,1,.36,1)}
  .panel.open ~ .tab{right:280px}
  .panel.edge-left ~ .tab{right:auto;left:0;border-radius:0 10px 10px 0;border-right:1px solid rgba(255,255,255,.08);border-left:none}
  .panel.edge-left.open ~ .tab{left:280px}
  .tab svg{width:16px;height:16px;fill:none;stroke:#888;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .panel.open ~ .tab svg{transform:rotate(180deg)}
  .panel.edge-left ~ .tab svg{transform:rotate(0)}
  .panel.edge-left.open ~ .tab svg{transform:rotate(180deg)}

  .btn{width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .15s,box-shadow .15s}
  .btn:hover{transform:scale(1.1)}
  .btn:active{transform:scale(.95)}
  .btn svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .btn-label{font-size:10px;color:#888;text-align:center;margin-top:4px}
  .btn-group{display:flex;flex-direction:column;align-items:center;gap:4px}

  .btn-blue{background:#1976D2;box-shadow:0 4px 15px rgba(25,118,210,.4)}
  .btn-orange{background:#FB8C00;box-shadow:0 4px 15px rgba(251,140,0,.4)}
  .btn-green{background:#388E3C;box-shadow:0 4px 15px rgba(56,142,60,.4)}
  .btn-purple{background:#7B1FA2;box-shadow:0 4px 15px rgba(123,31,162,.4)}

  .controls{position:absolute;bottom:20px;left:0;right:0;display:flex;gap:8px;justify-content:center;z-index:20}
  .controls button{padding:6px 14px;border:none;border-radius:8px;background:#333;color:#eee;font-size:12px;cursor:pointer;transition:background .2s}
  .controls button:hover{background:#444}
  .controls button.active{background:#1976D2}
  .controls button.toggle-btn{background:#FB8C00;font-weight:600}

  .hint{position:absolute;bottom:70px;left:0;right:0;text-align:center;font-size:12px;color:#666;z-index:20}
</style>
</head>
<body>

<div class="phone">
  <div class="screen">
    <div class="notch"></div>
    <div class="mock-app">
      <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1" fill="currentColor"/><rect x="14" y="3" width="7" height="7" rx="1" fill="currentColor"/><rect x="3" y="14" width="7" height="7" rx="1" fill="currentColor"/><rect x="14" y="14" width="7" height="7" rx="1" fill="currentColor"/></svg>
    </div>

    <!-- Panel -->
    <div id="panel" class="panel open">
      <div class="btn-group">
        <button class="btn btn-blue"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M22 12h-4M6 12H2M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M19.07 4.93l-2.83 2.83M7.76 16.24l-2.83 2.83"/></svg></button>
        <div class="btn-label">Сканер</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-orange"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h12"/><circle cx="20" cy="18" r="2"/></svg></button>
        <div class="btn-label">Полка</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-green"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
        <div class="btn-label">Артикул</div>
      </div>
      <div class="btn-group">
        <button class="btn btn-purple"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 9h16M4 13h10M4 17h6"/></svg></button>
        <div class="btn-label">ШК</div>
      </div>
    </div>

    <!-- Tab handle -->
    <div id="tab" class="tab" onclick="togglePanel()">
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </div>

    <div class="hint">Нажмите на стрелку →</div>

    <div class="controls">
      <button class="active" onclick="setEdge('right')">Справа</button>
      <button onclick="setEdge('left')">Слева</button>
      <button class="toggle-btn" onclick="togglePanel()">Открыть/Закрыть</button>
    </div>
  </div>
</div>

<script>
function togglePanel(){
  document.getElementById('panel').classList.toggle('open')
}
function setEdge(edge){
  const panel = document.getElementById('panel')
  panel.classList.remove('edge-left', 'edge-right')
  panel.classList.add('edge-' + edge)
  document.querySelectorAll('.controls button').forEach(b => b.classList.remove('active'))
  event.target.classList.add('active')
}
</script>
</body>
</html>
